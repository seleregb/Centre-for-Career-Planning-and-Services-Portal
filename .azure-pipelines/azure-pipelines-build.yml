trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'frontend/**'
      - 'backend/**'
      - '.azure-pipelines/azure-pipelines-build.yml'

variables:
- group: 'infrastructure-common'
- group: 'infrastructure-dev'

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: 'Build and Push Frontend (dev)'
            inputs:
              azureSubscription: tfARM
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Login
                az acr login --name $(acrName)
                
                echo "Building and pushing frontend image..."
                az acr build --registry $(acrName) \
                              --image $(imageRepositoryFrontend):latest \
                              --image $(imageRepositoryFrontend):dev-$(Build.BuildId) \
                              --file frontend/Dockerfile \
                              frontend
              workingDirectory: '$(System.DefaultWorkingDirectory)'

          - task: AzureCLI@2
            displayName: 'Build and Push Backend (dev)'
            inputs:
              azureSubscription: tfARM
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Login
                az acr login --name $(acrName)
                
                echo "Building and pushing backend image..."
                az acr build --registry $(acrName) \
                              --image $(imageRepositoryBackend):latest \
                              --image $(imageRepositoryBackend):dev-$(Build.BuildId) \
                              --file backend/Dockerfile \
                              backend
              workingDirectory: '$(System.DefaultWorkingDirectory)'
          # - task: Docker@2
