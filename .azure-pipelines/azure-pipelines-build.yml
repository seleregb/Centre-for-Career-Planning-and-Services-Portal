          - task: PublishBuildArtifacts@1
            displayName: 'Publish Docker Artifacts - Frontend'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/frontend'
              ArtifactName: 'ccps-portal-frontend'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Docker Artifacts - Backend'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/backend'
              ArtifactName: 'ccps-portal-backend'
              publishLocation: 'Container'
