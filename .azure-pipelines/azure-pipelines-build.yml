trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'frontend/**'
      - 'backend/**'
      - '.azure-pipelines/azure-pipelines-build.yml'

variables:
  imageRepositoryFrontend: ccps-portal/frontend
  imageRepositoryBackend: ccps-portal/backend
  dockerRegistryServiceConnection: 'DockerDevOps' # change to your service connection name

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push frontend
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryFrontend)
              dockerfile: frontend/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)
                latest
          - task: Docker@2
            displayName: Build and push backend
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryBackend)
              dockerfile: backend/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)
                latest
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)'
              ArtifactName: drop
