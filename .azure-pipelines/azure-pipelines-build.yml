trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'frontend/**'
      - 'backend/**'
      - '.azure-pipelines/azure-pipelines-build.yml'

variables:
- group: 'infrastructure-common'
- name: imageRepositoryFrontend
  value: ccps-portal/frontend
- name: imageRepositoryBackend
  value: ccps-portal/backend

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push frontend
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryFrontend)
              dockerfile: frontend/Dockerfile
              containerRegistry: $(dockerDeploymentSvc)
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)
                latest
          - task: Docker@2
            displayName: Build and push backend
            inputs:
              command: buildAndPush
              repository: $(imageRepositoryBackend)
              dockerfile: backend/Dockerfile
              containerRegistry: $(dockerDeploymentSvc)
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)
                latest
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)'
              ArtifactName: drop
