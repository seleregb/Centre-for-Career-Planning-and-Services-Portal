trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'infra/terraform/**'
      - '.azure-pipelines/azure-pipelines-infra-build.yml'

variables:
  terraformVersion: '1.14.0'

stages:
  - stage: ValidateInfrastructure
    displayName: 'Validate Terraform Configuration'
    jobs:
      - job: ValidateTerraform
        displayName: 'Validate Terraform Modules'
        pool:
          vmImage: ubuntu-latest
        strategy:
          matrix:
            Main_Dev:
              module: main
              environment: dev
              workingDirectory: 'infra/terraform/main'
              tfvarsFile: 'infra/terraform/main/dev/dev.tfvars'
              backendConfig: 'infra/terraform/main/dev/dev.conf'
            # Main_Stage:
            #   module: main
            #   environment: stage
            #   workingDirectory: 'infra/terraform/main'
            #   tfvarsFile: 'infra/terraform/main/stage/stage.tfvars'
            #   backendConfig: 'infra/terraform/main/stage/stage.conf'
            # Main_Prod:
            #   module: main
            #   environment: prod
            #   workingDirectory: 'infra/terraform/main'
            #   tfvarsFile: 'infra/terraform/main/prod/prod.tfvars'
            #   backendConfig: 'infra/terraform/main/prod/prod.conf'
            ACR_Dev:
              module: acr
              environment: dev
              workingDirectory: 'infra/terraform/acr'
              tfvarsFile: 'infra/terraform/acr/dev/dev.tfvars'
              backendConfig: 'infra/terraform/acr/dev/dev.conf'
            # ACR_Stage:
            #   module: acr
            #   environment: stage
            #   workingDirectory: 'infra/terraform/acr'
            #   tfvarsFile: 'infra/terraform/acr/stage/stage.tfvars'
            #   backendConfig: 'infra/terraform/acr/stage/stage.conf'
            # ACR_Prod:
            #   module: acr
            #   environment: prod
            #   workingDirectory: 'infra/terraform/acr'
            #   tfvarsFile: 'infra/terraform/acr/prod/prod.tfvars'
            #   backendConfig: 'infra/terraform/acr/prod/prod.conf'
            ContainerApps_Dev:
              module: container-apps
              environment: dev
              workingDirectory: 'infra/terraform/container-apps'
              tfvarsFile: 'infra/terraform/container-apps/dev/dev.tfvars'
              backendConfig: 'infra/terraform/container-apps/dev/dev.conf'
            # ContainerApps_Stage:
            #   module: container-apps
            #   environment: stage
            #   workingDirectory: 'infra/terraform/container-apps'
            #   tfvarsFile: 'infra/terraform/container-apps/stage/stage.tfvars'
            #   backendConfig: 'infra/terraform/container-apps/stage/stage.conf'
            # ContainerApps_Prod:
            #   module: container-apps
            #   environment: prod
            #   workingDirectory: 'infra/terraform/container-apps'
            #   tfvarsFile: 'infra/terraform/container-apps/prod/prod.tfvars'
            #   backendConfig: 'infra/terraform/container-apps/prod/prod.conf'
        steps:

          - task: TerraformInstaller@0
            displayName: 'Install Terraform $(terraformVersion)'
            inputs:
              terraformVersion: $(terraformVersion)

          - task: TerraformCLI@2
            displayName: 'Terraform Init - $(module) ($(environment))'
            inputs:
              command: 'init'
              commandOptions: '-backend=false'
              backendType: 'azurerm'
              backendServiceArm: 'tfARM'
              workingDirectory: $(workingDirectory)
              allowTelemetryCollection: true

          - task: TerraformCLI@2
            displayName: 'Terraform Validate - $(module) ($(environment))'
            inputs:
              command: 'validate'
              backendType: 'azurerm'
              backendServiceArm: 'tfARM'
              workingDirectory: $(workingDirectory)
              allowTelemetryCollection: true

      - job: PublishArtifacts
        displayName: 'Publish Infrastructure Artifacts'
        dependsOn: ValidateTerraform
        pool:
          vmImage: ubuntu-latest
        steps:

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Infrastructure Directory'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/infra'
              ArtifactName: 'infra'
              publishLocation: 'Container'

